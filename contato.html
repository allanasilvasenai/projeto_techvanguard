<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <header class="cabecalho">
        <div class="logo">🧷TechVanguard</div>
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="computacao.html">Computação em Nuvem</a>
            <a href="seguranca.html">Segurança Cibernética</a>
            <a href="ia.html">Inteligência Artificial</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="titulo-secao">✍🏼 Cadastre-se e entre em contato conosco !</h1>
        <p class="subtitulo">Preencha seus dados:</p>
        <div class="area-inscricao">
            <form action="/processar-cadastro" method="post" class="coluna-form">
                <label class="letra-form" for="nome">Nome Completo:</label>
                <input class="dados-form" type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required minlength="3" maxlength="60"><br>

                <label class="letra-form" for="senha">Senha de Acesso:</label>
                <input class="dados-form" type="password" name="senha" id="senha" placeholder="Digite uma senha forte" required minlength="8" maxlength="15"><br>

                <label class="letra-form" for="email">E-mail:</label>
                <input class="dados-form" type="email" name="email" id="email" placeholder="exemplo@dominio.com" required><br>

                <label class="letra-form" for="data_nasc">Data de Nascimento:</label>
                <input class="dados-form" type="date" id="data_nasc" name="data_nascimento" min="1900-01-01" max="2026-12-31" required><br><br>

                <input class="dados-form" type="checkbox" name="termos" id="termos" required>
                <label for="termos">Li e Aceitos os Termos e Condições</label><br><br>

                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Limpar Tudo</button>

            </form>
        </div>
    </main>
</body>
</html>
